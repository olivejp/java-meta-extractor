# Connexion par les variables libpq habituelles (PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD),
# les mêmes que celles des scripts de chargement.
carto_cafat:
  target: default
  outputs:
    default:
      type: postgres
      host: "{{ env_var('PGHOST', 'localhost') }}"
      port: "{{ env_var('PGPORT', '5432') | as_number }}"
      dbname: "{{ env_var('PGDATABASE', 'carto') }}"
      user: "{{ env_var('PGUSER', 'carto') }}"
      password: "{{ env_var('PGPASSWORD', '') }}"
      schema: public
      threads: 4
