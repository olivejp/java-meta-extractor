version: 2

models:
  - name: core_application
    description: Applications extraites, rattachées à un SA et un SSA.
    columns:
      - name: app_id
        data_tests: [unique, not_null]
      - name: classification_source
        data_tests:
          - accepted_values: {values: [referentiel, convention]}
  - name: core_sa
    columns:
      - name: sa_code
        data_tests: [unique, not_null]
  - name: core_ssa
    columns:
      - name: ssa_id
        data_tests: [unique, not_null]
      - name: sa_code
        data_tests:
          - relationships: {to: ref('core_sa'), field: sa_code}
  - name: core_datasource
    columns:
      - name: database
        data_tests: [not_null]
  - name: core_table_usage
    columns:
      - name: usage_id
        data_tests: [unique, not_null]
      - name: table_id
        data_tests:
          - relationships: {to: ref('core_table'), field: table_id}
      - name: catalog_status
        data_tests:
          - accepted_values: {values: [present, absent, ambiguous, no_catalog]}
  - name: core_table
    columns:
      - name: table_id
        data_tests: [unique, not_null]
  - name: core_column_usage
    columns:
      - name: column_usage_id
        data_tests: [unique, not_null]
  - name: core_rest_call
    columns:
      - name: call_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              values: [resolved, ambiguous, partial, unresolved, no_endpoint, version_mismatch, target_not_extracted]
  - name: core_queue
    columns:
      - name: destination
        data_tests: [unique, not_null]
  - name: core_jms_exchange
    columns:
      - name: exchange_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values: {values: [linked, no_producer, no_consumer, unresolved_destination]}
